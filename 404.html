<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Animal Chatter</title>
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shubhamraaj.github.io/Project-for-Future-Kind/404.html">
  <meta property="og:title" content="Page Not Found | Animal Chatter">
  <meta property="og:description" content="The requested page could not be found. Navigate back to Animal Chatter homepage or browse news streams.">

  <!-- Favicon Icons -->
  <link rel="icon" type="image/x-icon" href="https://shubhamraaj.github.io/Project-for-Future-Kind/favicon.ico">

  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Dark Theme Overrides */
    [data-theme="dark"] {
      background-color: #0f172a !important;
      color: #f8fafc !important;
    }

    [data-theme="dark"] header {
      background-color: #021a30 !important;
    }

    [data-theme="dark"] .error-code {
      color: #38bdf8 !important;
    }

    [data-theme="dark"] h1 {
      color: #ffffff !important;
    }

    [data-theme="dark"] p {
      color: #94a3b8 !important;
    }

    [data-theme="dark"] .btn-secondary {
      background-color: #334155 !important;
      color: #f8fafc !important;
    }

    [data-theme="dark"] .btn-secondary:hover {
      background-color: #475569 !important;
    }

    [data-theme="dark"] footer {
      background-color: #021a30 !important;
      border-top: 1px solid #1e293b;
    }

    /* Header */
    header {
      background-color: #033666;
      color: white;
      padding: 1rem 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease;
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: white;
      text-decoration: none;
    }

    /* Theme Toggle Button Styling */
    .theme-toggle-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* 404 Hero Container */
    main {
      max-width: 800px;
      margin: 4rem auto;
      padding: 0 1.5rem;
      text-align: center;
      flex-grow: 1;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 900;
      color: #033666;
      line-height: 1;
      margin-bottom: 0.5rem;
      transition: color 0.3s ease;
    }
    .error-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2rem;
      color: #0f172a;
      margin-bottom: 1rem;
      transition: color 0.3s ease;
    }
    p {
      color: #64748b;
      font-size: 1.1rem;
      margin-bottom: 2rem;
      transition: color 0.3s ease;
    }

    /* Quick Links Grid */
    .link-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0369a1;
    }
    .btn-secondary {
      background-color: #e2e8f0;
      color: #0f172a;
    }
    .btn-secondary:hover {
      background-color: #cbd5e1;
    }

    /* Footer */
    footer {
      background: #0f172a;
      color: #94a3b8;
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
      margin-top: auto;
      transition: background-color 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <a href="https://shubhamraaj.github.io/Project-for-Future-Kind/index.html" class="logo">Animal Chatter</a>
      
      <!-- Theme Switcher Button -->
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
        <span id="theme-icon">🌙</span>
        <span id="theme-text">Dark</span>
      </button>
    </div>
  </header>

  <!-- Main 404 Content -->
  <main>
    <div class="error-code">404</div>
    <div class="error-icon">🐾</div>
    <h1>Looks Like You've Wandered Off Trail</h1>
    <p>The page or news stream you are looking for doesn't exist, was renamed, or has been moved.</p>

    <div class="link-group">
      <a href="https://shubhamraaj.github.io/Project-for-Future-Kind/index.html" class="btn btn-primary">Return to Home Page</a>
      <a href="https://shubhamraaj.github.io/Project-for-Future-Kind/search.html" class="btn btn-secondary">Search Articles</a>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    &copy; Animal Chatter | Local Ecological Journalism Hub
  </footer>

  <!-- Dark Mode Switcher JavaScript -->
  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeText = document.getElementById('theme-text');

    // Load saved preference or check system preferences
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeIcon.textContent = '☀️';
      themeText.textContent = 'Light';
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      themeIcon.textContent = '🌙';
      themeText.textContent = 'Dark';
    }

    // Toggle theme on button click
    toggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      let newTheme = 'light';

      if (currentTheme === 'light') {
        newTheme = 'dark';
        themeIcon.textContent = '☀️';
        themeText.textContent = 'Light';
      } else {
        themeIcon.textContent = '🌙';
        themeText.textContent = 'Dark';
      }

      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });
  </script>

</body>
</html>
