name: Automated News Update
permissions:
  contents: write
on:
  schedule:
    # Runs every day at 8:00 AM Indian Standard Time (2:30 AM UTC)
    - cron: '30 2 * * *'
  workflow_dispatch: # Adds a manual "Run" button so you can test it instantly!

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Scraper Tools
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests

      - name: Run News Scraper
        run: python curate_news.py

      - name: Commit and Push Updated Website
        run: |
          git config --global user.name "shubhamraaj"
          git config --global user.email "automation@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated News Update [skip ci]" && git push)
